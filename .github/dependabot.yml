version: 2
updates:
  # pnpm workspace root — covers apps/web and packages/shared (apps/mobile
  # excluded: no package.json exists there yet, since Expo hasn't been
  # bootstrapped — add an entry for it once it is).
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      npm-prod-dependencies:
        dependency-type: "production"
        update-types: ["minor", "patch"]
      npm-dev-dependencies:
        dependency-type: "development"
        update-types: ["minor", "patch"]
    ignore:
      # Both broke CI as routine-looking bumps (Tailwind v4 moved its
      # PostCSS plugin to a separate package; eslint-config-next 16 needs a
      # newer ESLint than we're pinned to). Real migrations, not patches —
      # revisit deliberately rather than letting Dependabot reopen these.
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint-config-next"
        update-types: ["version-update:semver-major"]

  # apps/api — requirements/{base,dev,prod}.txt
  - package-ecosystem: "pip"
    directory: "/apps/api/requirements"
    schedule:
      interval: "weekly"
      day: "monday"

  # Workflow files under .github/workflows/
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
