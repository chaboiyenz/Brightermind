name: CI

# Pipeline skeleton per TDD.MD §7 — test/lint on every PR, build+deploy on merge to main.
# Actual build/deploy steps are filled in once infra/ is provisioned.
# no-op: trigger CI run

on:
  pull_request:
  push:
    branches: [main]

jobs:
  js:
    name: JS (web + mobile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # apps/mobile has no package.json yet (Expo not bootstrapped) — these
      # only touch apps/web/packages/shared until it exists.
      - run: pnpm --filter web lint
      - run: pnpm --filter web typecheck
      - run: pnpm --filter web build
      # TODO: add a `test` step once apps/web has a test framework configured
      # (no jest/vitest setup exists yet).

      # Advisory only — reports known-vulnerable prod dependencies without
      # blocking the merge.
      - name: Dependency audit (advisory)
        run: pnpm audit --prod --audit-level high
        continue-on-error: true

  python:
    name: Python (api)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    env:
      # CI-only stand-ins matching .env.example — never real secrets, just
      # enough for manage.py/pytest to import settings and run against a
      # throwaway sqlite db.
      DJANGO_SECRET_KEY: ci-test-secret-key
      DJANGO_DEBUG: "True"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      DATABASE_URL: sqlite:///db.sqlite3
      CORS_ALLOWED_ORIGINS: http://localhost:3000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements/dev.txt

      - run: pip install -r requirements/dev.txt

      - run: ruff check .
      - run: pytest

      # Advisory only — reports known-vulnerable installed packages without
      # blocking the merge.
      - name: Dependency audit (advisory)
        run: pip install pip-audit && pip-audit
        continue-on-error: true

      # Blocking — a model change committed without its migration is a real
      # bug (this is what production migration drift looks like), not
      # something to merge and fix later.
      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

  # TODO (on merge to main): build Docker image for apps/api, push to Amazon ECR,
  # deploy to App Runner/ECS via GitHub OIDC -> AWS IAM role assumption (TDD §6.3).
  # TODO: trigger EAS Build/Submit for apps/mobile from this workflow (TDD §7).
