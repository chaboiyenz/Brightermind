name: CI

# Pipeline skeleton per TDD.MD §7 — test/lint on every PR, build+deploy on merge to main.
# Actual build/deploy steps are filled in once infra/ is provisioned.
# no-op: trigger CI run

on:
  pull_request:
  push:
    branches: [main]

jobs:
  js:
    name: JS (web + mobile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # apps/mobile has no package.json yet (Expo not bootstrapped) — these
      # only touch apps/web/packages/shared until it exists.
      - run: pnpm --filter web lint
      - run: pnpm --filter web typecheck
      - run: pnpm --filter web build
      # Vitest landed with the role-based session system (PR #85) — this was
      # a genuine TODO above, not a placeholder; the framework now exists.
      - run: pnpm --filter web test

      # Advisory only — reports known-vulnerable prod dependencies without
      # blocking the merge.
      - name: Dependency audit (advisory)
        run: pnpm audit --prod --audit-level high
        continue-on-error: true

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    # Non-blocking for now: this is the suite's first pass (demo-polish
    # audit, see docs/project-overview.md §5) and hasn't had time to prove
    # itself stable in CI yet. Flagging rather than deciding silently, per
    # that task's own instruction — promote to blocking (drop
    # continue-on-error) once it's been green for a while.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      - name: Run Playwright suite
        working-directory: apps/web
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 14

  python:
    name: Python (api)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    env:
      # CI-only stand-ins matching .env.example — never real secrets, just
      # enough for manage.py/pytest to import settings and run against a
      # throwaway sqlite db.
      DJANGO_SECRET_KEY: ci-test-secret-key
      DJANGO_DEBUG: "True"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      DATABASE_URL: sqlite:///db.sqlite3
      CORS_ALLOWED_ORIGINS: http://localhost:3000
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements/dev.txt

      - run: pip install -r requirements/dev.txt

      - run: ruff check .
      - run: pytest

      # Advisory only — reports known-vulnerable installed packages without
      # blocking the merge.
      - name: Dependency audit (advisory)
        run: pip install pip-audit && pip-audit
        continue-on-error: true

      # Blocking — a model change committed without its migration is a real
      # bug (this is what production migration drift looks like), not
      # something to merge and fix later.
      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

  # TODO (on merge to main): build Docker image for apps/api, push to Amazon ECR,
  # deploy to App Runner/ECS via GitHub OIDC -> AWS IAM role assumption (TDD §6.3).
  # TODO: trigger EAS Build/Submit for apps/mobile from this workflow (TDD §7).
