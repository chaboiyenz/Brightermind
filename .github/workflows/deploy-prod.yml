name: Deploy — production

# Deploys the API (apps/api) only, and is dormant until AWS infra exists (see
# the job condition below). The web app deploys to Vercel instead —
# docs/ci-cd/vercel-setup.md.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy" to confirm a production deployment'
        required: true

concurrency:
  group: deploy-prod
  cancel-in-progress: false # never cancel an in-flight prod deploy

permissions:
  id-token: write
  contents: read

jobs:
  guard:
    name: Confirm intent
    runs-on: ubuntu-latest
    steps:
      - name: Check confirmation input
        if: ${{ github.event.inputs.confirm != 'deploy' }}
        run: |
          echo "Confirmation text did not match 'deploy'. Aborting."
          exit 1

      # Unlike dev and stage, this workflow only runs when a human deliberately
      # dispatched it. Letting the deploy job skip silently would report success
      # for a production deploy that never happened, so say why instead.
      - name: Check infra is configured
        if: ${{ vars.AWS_DEPLOYS_ENABLED != 'true' }}
        run: |
          echo "AWS infra is not provisioned — infra/ is still an empty scaffold (TDD §9)."
          echo "Provision it, configure the main environment per docs/ci-cd/environment-setup.md,"
          echo "then set the AWS_DEPLOYS_ENABLED repository variable to \"true\"."
          exit 1

  deploy:
    name: Build & deploy to production
    needs: guard
    runs-on: ubuntu-latest
    # "main" here is the GitHub Environment name — configure it with required
    # reviewers under Settings > Environments so this job pauses for approval.
    environment: main
    # Belt and braces: the guard job above already fails a dispatch made before
    # infra exists, so this only matters if that check is ever relaxed. See
    # deploy-dev.yml for why the switch is its own repository variable.
    if: vars.AWS_DEPLOYS_ENABLED == 'true'
    steps:
      - uses: actions/checkout@v7

      - name: Configure AWS credentials (OIDC, no stored keys)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & push API image
        run: |
          docker build -t $ECR_REGISTRY/brightermind-api:prod-${{ github.sha }} apps/api
          docker push $ECR_REGISTRY/brightermind-api:prod-${{ github.sha }}
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}

      # TODO: replace with actual App Runner / ECS deploy step once infra/ is provisioned
      - name: Run DB migrations against production
        run: echo "TODO — run python manage.py migrate against prod RDS instance"

      - name: Deploy to App Runner (production)
        run: echo "TODO — deploy image to prod App Runner service"

      - name: Build & submit mobile release (EAS)
        run: echo "TODO — trigger EAS Build + Submit for production profile once Expo project exists"
