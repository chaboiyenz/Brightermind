name: Deploy — dev

on:
  push:
    branches: [dev]

concurrency:
  group: deploy-dev
  cancel-in-progress: true

permissions:
  id-token: write # required for OIDC -> AWS role assumption
  contents: read

jobs:
  deploy:
    name: Build & deploy to dev
    runs-on: ubuntu-latest
    environment: dev # maps to a GitHub Environment with its own secrets/protection rules
    # infra/ is still an empty scaffold (TDD §9): there is no region, no OIDC
    # role, no ECR repository and no App Runner service to deploy to, so this
    # job could only ever fail at its first AWS step and redden every merge to
    # dev. Skipping keeps the workflow here as the blueprint it was written to
    # be. Set the AWS_DEPLOYS_ENABLED repository variable to "true" to switch
    # deploys back on — no edit to this file required.
    #
    # Why a dedicated repository variable rather than testing AWS_REGION: a
    # job-level `if` is evaluated before the job's `environment:` is resolved,
    # so neither environment secrets nor environment variables are readable
    # here. docs/ci-cd/environment-setup.md sets AWS_REGION per environment,
    # so a check on it would read as empty and skip forever, even after infra
    # lands. Only repository and organization variables work in this position.
    if: vars.AWS_DEPLOYS_ENABLED == 'true'
    steps:
      - uses: actions/checkout@v7

      - name: Configure AWS credentials (OIDC, no stored keys)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & push API image
        run: |
          docker build -t $ECR_REGISTRY/brightermind-api:dev-${{ github.sha }} apps/api
          docker push $ECR_REGISTRY/brightermind-api:dev-${{ github.sha }}
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}

      # TODO: replace with actual App Runner / ECS deploy step once infra/ is provisioned
      - name: Deploy to App Runner (dev)
        run: echo "TODO — deploy image to dev App Runner service"

      - name: Build & publish mobile preview (EAS)
        run: echo "TODO — trigger EAS Build for dev profile once Expo project exists"
